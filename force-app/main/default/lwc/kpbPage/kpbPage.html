<template>
    <div class="slds-p-around_medium">

        <template lwc:if={isLoading}>
            <lightning-spinner alternative-text="Loading..." size="medium"></lightning-spinner>
        </template>

        <template lwc:if={fetchError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">Error</span>
                <h2>Failed to load cost group: {fetchError}</h2>
            </div>
        </template>

        <template lwc:if={parseError}>
            <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_medium" role="alert">
                <span class="slds-assistive-text">Error</span>
                <h2>JSON parse error: {parseError}</h2>
            </div>
        </template>

        <template lwc:if={isNew}>
            <lightning-card title="New Cost Group">
                <div class="slds-p-around_medium">
                    <p class="slds-text-color_weak">No data loaded — creating a new cost group.</p>
                </div>
            </lightning-card>
        </template>

        <template lwc:if={hasData}>

            <lightning-card title="Cost Group">
                <div class="slds-p-around_medium slds-grid slds-wrap">
                    <template for:each={mainFields} for:item="field">
                        <div key={field.id} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                            <template lwc:if={field.isCheckbox}>
                                <lightning-input
                                    type="checkbox"
                                    label={field.label}
                                    checked={field.value}
                                    data-key={field.key}
                                    onchange={handleFieldChange}>
                                </lightning-input>
                            </template>
                            <template lwc:else>
                                <lightning-input
                                    type={field.inputType}
                                    label={field.label}
                                    value={field.value}
                                    data-key={field.key}
                                    onchange={handleFieldChange}>
                                </lightning-input>
                            </template>
                        </div>
                    </template>
                </div>
            </lightning-card>

            <template for:each={sections} for:item="section">
                <lightning-card key={section.name} title={section.label} class="slds-m-top_medium">
                    <div class="slds-p-around_medium slds-grid slds-wrap">
                        <template for:each={section.fields} for:item="field">
                            <div key={field.id} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                                <template lwc:if={field.isCheckbox}>
                                    <lightning-input
                                        type="checkbox"
                                        label={field.label}
                                        checked={field.value}
                                        data-key={field.key}
                                        data-section={section.name}
                                        onchange={handleFieldChange}>
                                    </lightning-input>
                                </template>
                                <template lwc:else>
                                    <lightning-input
                                        type={field.inputType}
                                        label={field.label}
                                        value={field.value}
                                        data-key={field.key}
                                        data-section={section.name}
                                        onchange={handleFieldChange}>
                                    </lightning-input>
                                </template>
                            </div>
                        </template>
                    </div>
                </lightning-card>
            </template>

            <lightning-card title="Components" class="slds-m-top_medium">
                <div class="slds-p-around_medium">
                    <template lwc:if={hasComponentOptions}>
                        <lightning-combobox
                            label="Add component"
                            placeholder="Select a component..."
                            value={selectedCompId}
                            options={componentOptions}
                            onchange={handleComponentSelect}>
                        </lightning-combobox>
                    </template>
                    <template lwc:else>
                        <p class="slds-text-color_weak slds-text-body_small">All components are displayed below.</p>
                    </template>
                </div>
            </lightning-card>

            <template for:each={visibleComponents} for:item="comp">
                <lightning-card key={comp.id} title={comp.label} class="slds-m-top_medium">

                    <div slot="actions">
                        <lightning-button-icon
                            icon-name="utility:hide"
                            variant="bare"
                            alternative-text="Hide component"
                            data-comp-id={comp.id}
                            onclick={handleComponentHide}>
                        </lightning-button-icon>
                    </div>

                    <div class="slds-p-around_medium">

                        <p class="slds-text-heading_small slds-m-bottom_x-small">Fields</p>
                        <div class="slds-grid slds-wrap">
                            <template for:each={comp.fields} for:item="field">
                                <div key={field.id} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                                    <template lwc:if={field.isCheckbox}>
                                        <lightning-input
                                            type="checkbox"
                                            label={field.label}
                                            checked={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                    <template lwc:else>
                                        <lightning-input
                                            type={field.inputType}
                                            label={field.label}
                                            value={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <p class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">Value</p>
                        <div class="slds-grid slds-wrap">
                            <template for:each={comp.valueFields} for:item="field">
                                <div key={field.id} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                                    <template lwc:if={field.isCheckbox}>
                                        <lightning-input
                                            type="checkbox"
                                            label={field.label}
                                            checked={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            data-sub-section="value"
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                    <template lwc:else>
                                        <lightning-input
                                            type={field.inputType}
                                            label={field.label}
                                            value={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            data-sub-section="value"
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </template>
                        </div>

                        <p class="slds-text-heading_small slds-m-top_medium slds-m-bottom_x-small">Audit</p>
                        <div class="slds-grid slds-wrap">
                            <template for:each={comp.auditFields} for:item="field">
                                <div key={field.id} class="slds-col slds-size_1-of-3 slds-p-around_x-small">
                                    <template lwc:if={field.isCheckbox}>
                                        <lightning-input
                                            type="checkbox"
                                            label={field.label}
                                            checked={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            data-sub-section="audit"
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                    <template lwc:else>
                                        <lightning-input
                                            type={field.inputType}
                                            label={field.label}
                                            value={field.value}
                                            data-key={field.key}
                                            data-comp-id={comp.id}
                                            data-sub-section="audit"
                                            onchange={handleFieldChange}>
                                        </lightning-input>
                                    </template>
                                </div>
                            </template>
                        </div>

                    </div>
                </lightning-card>
            </template>

        </template>


    </div>
</template>
