<template>
    <lightning-modal-header label="Goedkeuring aanvragen"></lightning-modal-header>
    <lightning-modal-body>
        <div class="slds-p-around_medium">
            <lightning-input
                label="Reden aanvraag goedkeuring"
                value={reason}
                required
                onchange={handleReasonChange}>
            </lightning-input>
        </div>
    </lightning-modal-body>
    <lightning-modal-footer>
        <lightning-button
            label="Annuleren"
            variant="neutral"
            onclick={handleCancel}>
        </lightning-button>
        <lightning-button
            label="Versturen"
            variant="brand"
            disabled={submitDisabled}
            onclick={handleSubmit}>
        </lightning-button>
    </lightning-modal-footer>
</template>
